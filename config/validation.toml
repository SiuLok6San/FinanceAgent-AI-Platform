# Deterministic validation layer (facts.py, validators.py).

# Units treated as percent levels (so "4.3%" or "430 bp" can match them).
percent_units = ["Percent", "Percentage Points"]

# ---------------------------------------------------------------------------
# Derived values: simple arithmetic on fetched data that a report may quote.
# Changes are latest value vs. the value N periods earlier: by calendar for
# weekly/monthly/quarterly series, by observation (trading day) for daily.
# ---------------------------------------------------------------------------
[derived.lags]
daily = [1, 5, 21, 63, 126, 252]   # ~1 day, 1 week, 1/3/6/12 months
weekly = [1, 4, 13, 26, 52]
monthly = [1, 3, 6, 12]
quarterly = [1, 2, 4]

# ---------------------------------------------------------------------------
# Number extraction: spans that contain digits but are labels, not values.
# ---------------------------------------------------------------------------
[extraction]
# Mask these phrases before extracting numbers (case-insensitive).
label_phrases = [
    "S&P 500", "S&P 400", "S&P 600", "Russell 1000", "Russell 2000", "Russell 3000",
    "Nasdaq 100", "Nasdaq-100", "Dow Jones 30", "FTSE 100", "Stoxx 600", "Euro Stoxx 50",
    "Nikkei 225", "DAX 40", "CAC 40", "Hang Seng 50", "60/40", "401(k)", "Basel III",
]
# A number directly preceded by one of these words is a label ("Table 2").
label_words = [
    "table", "chart", "figure", "fig", "exhibit", "section", "step", "scenario",
    "appendix", "tier", "phase", "part", "option", "item", "source",
]
# A number followed by one of these units is a time span or tenor ("12 months").
time_units = ["year", "yr", "month", "mo", "week", "wk", "day", "quarter", "hour", "minute"]
# Integers in this range with no unit are treated as year labels ("in 2026").
year_label_range = [1900, 2100]

# ---------------------------------------------------------------------------
# Data freshness: maximum age (days) of the latest observation, measured
# from the END of its period (a monthly value dated 2026-09-01 covers
# September, so its age is counted from 2026-09-30).
# ---------------------------------------------------------------------------
[freshness.max_age_days]
daily = 7
weekly = 14
monthly = 60
quarterly = 135

# ---------------------------------------------------------------------------
# No-data honesty: a sentence that discloses missing data must match one of
# these patterns (regex, case-insensitive) and mention the topic.
# ---------------------------------------------------------------------------
[no_data]
disclosure_patterns = [
    "\\bno\\b[^.]{0,60}\\bdata\\b",
    "\\bdata\\b[^.]{0,60}\\b(not available|unavailable|not fetched|was not fetched|were not fetched|missing|could not be retrieved|not retrieved)\\b",
    "\\b(without|lack of|lacking|absence of)\\b[^.]{0,40}\\bdata\\b",
]

# ---------------------------------------------------------------------------
# Assumptions: an unverified number that the report itself marks as an
# assumption (e.g. "16× (assumption)") stays "unverified", but it is counted
# separately and is not treated as a no-data honesty problem. Patterns are
# matched against the number's sentence (regex, case-insensitive).
# ---------------------------------------------------------------------------
[assumptions]
patterns = ["\\(assumption\\)", "\\bassum(e|ed|es|ing|ption|ptions)\\b", "\\bhypothetical", "\\billustrative"]

# ---------------------------------------------------------------------------
# Direction check: a change figure (e.g. "+25 bp", or a number that matches a
# change in the data) must not sit next to a word saying the opposite
# ("rose" next to a fall). Only words with one clear direction are listed;
# "tightening"/"easing" are left out because they mean opposite things for
# spreads and for monetary policy.
# ---------------------------------------------------------------------------
[directions]
window_chars = 60
# a hedged or conditional clause ("spreads could widen 20 bp if ...") describes a scenario, not the data
skip_words = ["if", "could", "may", "might", "would", "should", "unless", "scenario", "assume", "assuming",
              "expect", "expected", "expects", "forecast", "likely", "will", "potential", "monitor", "watch"]
up = [
    "rose", "rise", "rises", "rising", "risen", "increase", "increased", "increases", "increasing",
    "up", "higher", "widened", "widening", "widen", "widens", "climbed", "climbing", "gained", "jumped",
    "surged", "accelerated", "rebounded", "steepened", "steepening", "grew", "expanded", "advanced",
]
down = [
    "fell", "fall", "falls", "falling", "fallen", "decrease", "decreased", "decreases", "decreasing",
    "down", "lower", "narrowed", "narrowing", "narrows", "declined", "decline", "declines", "declining",
    "dropped", "drop", "slowed", "slowing", "cooled", "cooling", "softened", "plunged", "contracted",
    "flattened", "flattening", "shrank", "slipped", "retreated",
]

# ---------------------------------------------------------------------------
# Comparison check (reports written with fact placeholders): in a sentence
# like "{{A}} is above {{B}}", A and B must be in comparable units and the
# order must match the data. Neutral words ("relative to", "vs") only need
# comparable units. Families group units that can be compared.
# ---------------------------------------------------------------------------
[comparisons]
# "over" is left out: "over three months" is about time, not a comparison
above = ["above", "higher than", "greater than", "more than", "exceeds", "exceeding"]
below = ["below", "lower than", "less than", "under", "beneath"]
neutral = ["relative to", "compared with", "compared to", "versus", "vs", "vs."]

[comparisons.unit_families]
percent = "rate"
pp = "rate"
bp = "rate"
pct = "rate"
x = "multiple"
index = "index"
pts = "index"
usd = "money"
bn_usd = "money"
count = "count"
ratio = "ratio"
percentile = "percentile"

# ---------------------------------------------------------------------------
# Wording checks: statements about where a series sits in its history
# ("near five-year lows", "elevated") and about its current direction
# ("spreads are tightening") are compared with the data, whether or not the
# sentence quotes a number. Sentences with hedges or conditions ("if",
# "could", "likely", ...) and negated phrases are skipped: scenarios and
# forecasts are not claims about the data.
# ---------------------------------------------------------------------------
[wording]
skip_words = ["if", "could", "may", "might", "would", "should", "unless", "scenario", "assume", "assuming",
              "expect", "expected", "expects", "forecast", "likely", "will", "potential", "risk", "outlook",
              "monitor", "watch", "upside", "downside", "until"]
negations = ["not", "no", "no longer", "isn't", "aren't", "never", "hardly", "rather than", "instead of", "without"]

[wording.history]
# percentile of the latest value in its fetched history (fact_store *.pctile_*)
low_max_pctile = 33
high_min_pctile = 67
middle_range = [20, 80]
# history needed to judge these words: at least min_years, and a phrase naming a horizon needs that
# horizon (FRED's ICE credit spreads have 3 years: "historically tight" is checked, "five-year low" is not)
min_years = 3
phrase_years = { "five-year" = 5, "5-year" = 5, "ten-year" = 10, "10-year" = 10, "decade" = 10 }
low = ["historically low", "historically tight", "near its lows", "near their lows", "near lows", "near the lows",
       "five-year low", "five-year lows", "5-year low", "5-year lows", "multi-year low", "record low", "near the bottom",
       "tight relative to history", "tight by historical standards", "compressed", "near historic lows"]
high = ["historically high", "historically wide", "near its highs", "near their highs", "near highs", "near the highs",
        "five-year high", "five-year highs", "5-year high", "5-year highs", "multi-year high", "record high",
        "elevated", "wide relative to history", "wide by historical standards", "near historic highs"]
middle = ["near the median", "near its median", "near the average", "near its average", "near their average",
          "around its average", "in line with history", "near the long-term average", "near the long-term median",
          "near historical norms"]

[wording.trend]
# Progressive trend words with one clear direction for the series they name. Words whose meaning
# depends on the subject are left out: a "cooling" labour market means unemployment is rising, and
# "easing"/"slowing"/"accelerating" usually describe a growth rate. "tightening" depends on the group.
up = ["rising", "widening", "increasing", "climbing", "steepening", "moving higher", "trending higher", "trending up"]
down = ["falling", "narrowing", "decreasing", "declining", "flattening", "compressing", "moving lower",
        "trending lower", "trending down"]
tightening = { credit_spread = "down", yield = "up" }
# For price indexes and GDP, trend words describe the growth rate ("inflation is falling"), but the
# fact store has the level's changes, which are almost always positive; these series are not checked.
skip_series = ["CPI", "PCE", "GDP"]

# For price indexes and GDP these words describe the growth rate, so they are checked against the
# rate, not the level. A word is flagged only if both measures contradict it: the 12-month rate
# against a period earlier, and the short-term pace (monthly series: the last 3 months annualized
# against the 12-month rate; quarterly: the latest quarter annualized against the one before).
[wording.rate_trend]
series = ["CPI", "PCE", "GDP"]
down = ["cooling", "easing", "slowing", "decelerating", "deceleration", "moderating", "softening", "disinflation"]
up = ["accelerating", "acceleration", "re-accelerating", "reaccelerating", "reacceleration", "heating up",
      "picking up"]
min_gap = 0.05   # percentage points; smaller differences count as no change
# "easing" of monetary policy is not inflation easing
exclude = ["easing policy", "policy easing", "monetary easing", "easing cycle", "easing bias", "quantitative easing",
           "fed easing", "rate easing", "easing financial conditions", "easing of financial conditions"]
# the fetched series is headline CPI / PCE; a sentence about another measure is not checked
other_measures = ["core", "components", "categories", "services inflation", "goods inflation", "wage", "wages"]

# a horizon named in the sentence picks which change to compare with (default: the latest month)
[wording.trend.horizons]
"year" = "1y"
"12-month" = "1y"
"twelve months" = "1y"
"annual" = "1y"
"six months" = "6m"
"6-month" = "6m"
"quarter" = "3m"
"three months" = "3m"
"3-month" = "3m"
"week" = "1w"

# names a sentence may use for a series (matched as whole words); a sentence is checked only if it
# clearly points to one series (by a fact it quotes or by one of these names)
[wording.series_names]
HY_OAS = ["high yield", "high-yield spread", "high-yield spreads", "hy spread", "hy spreads", "hy oas", "junk bond spreads"]
IG_OAS = ["investment grade", "investment-grade spread", "investment-grade spreads", "ig spread", "ig spreads", "ig oas"]
UST10Y = ["10-year yield", "10-year treasury", "10y yield", "ten-year yield"]
UST2Y = ["2-year yield", "2-year treasury", "2y yield", "two-year yield"]
CURVE_10Y2Y = ["yield curve", "curve", "2s10s", "10s2s"]
FEDFUNDS = ["fed funds", "federal funds", "policy rate"]
MORTGAGE30 = ["mortgage rate", "mortgage rates"]
CPI = ["cpi", "inflation", "consumer prices"]
PCE = ["pce"]
UNRATE = ["unemployment", "jobless rate"]
SAHM = ["sahm"]
GDP = ["gdp", "real gdp"]
SP500 = ["s&p 500", "equity market", "stock market"]
VIX = ["vix", "volatility"]
WTI = ["oil", "wti", "crude"]
