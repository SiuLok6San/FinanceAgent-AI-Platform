# Rule-based question routing (router.py, router_tier2.py).
#
# Matching rules: case-insensitive, whole words only, hyphens count as
# spaces, and a trailing "s"/"es" is allowed. So "spread" also matches
# "spreads", "high yield" matches "high-yield", and "rate" does NOT match
# "corporate". Phrases in exclude_phrases are removed from the question
# before that tag's keywords are checked (e.g. "unemployment rate" is a
# macro term, not a rates term).

tag_order = ["macro", "rates", "credit", "portfolio", "equity"]
fallback_tags = ["macro"]
tier2_fallback = { general = "broad_financial_question" }

# ---------------------------------------------------------------------------
# Tier 1: high-level topic tags (a question can get several)
# ---------------------------------------------------------------------------
[tier1.macro]
keywords = [
    "inflation", "cpi", "ppi", "pce", "gdp", "growth", "economy", "labor",
    "employment", "unemployment", "jobless", "payroll", "productivity",
    "recession", "soft landing", "hard landing", "macro", "economic outlook",
    "macro outlook",
]
exclude_phrases = ["earnings growth", "revenue growth", "dividend growth", "growth vs value"]

[tier1.rates]
keywords = [
    "rate", "fed", "monetary policy", "yield", "curve", "yield curve", "bond",
    "treasury", "treasuries", "duration", "higher for longer", "ffr",
    "federal reserve", "federal funds", "fomc",
]
exclude_phrases = [
    "unemployment rate", "inflation rate", "growth rate", "participation rate",
    "default rate", "high yield", "dividend yield", "earnings yield",
    "corporate bond", "junk bond",
]

[tier1.credit]
keywords = [
    "credit", "spread", "ig", "investment grade", "high yield", "hy",
    "default", "default risk", "credit cycle", "credit spread",
    "corporate bond", "junk bond", "oas", "leveraged loan", "downgrade",
]
exclude_phrases = ["credit card"]

[tier1.portfolio]
keywords = [
    "portfolio", "allocation", "allocate", "diversification", "diversified",
    "var", "sharpe", "risk parity", "asset mix", "hedge", "hedging",
    "rebalance", "rebalanced", "rebalancing", "returns", "risk budgeting",
]
exclude_phrases = []

[tier1.equity]
keywords = [
    "stock", "equity", "equities", "valuation", "eps", "earnings", "multiple",
    "pe", "p/e", "pb", "p/b", "cash flow", "fundamental",
]
exclude_phrases = ["private equity", "home equity"]

# ---------------------------------------------------------------------------
# Tier 2: one specialization per tag; the first matching rule wins
# ---------------------------------------------------------------------------
[[tier2.rates]]
label = "yield_curve_inversion"
keywords = ["yield curve", "inversion", "inverted", "10s2s", "2s10s", "steepen", "steepening", "flatten", "flattening"]

[[tier2.rates]]
label = "fed_cut_cycle"
keywords = ["fed cut", "rate cut", "cut cycle", "easing"]

[[tier2.rates]]
label = "fed_hike_cycle"
keywords = ["fed hike", "rate hike", "tightening", "restrictive", "higher for longer"]

[[tier2.rates]]
label = "duration_volatility"
keywords = ["duration", "treasury volatility", "bond volatility"]

[[tier2.macro]]
label = "inflation"
keywords = ["inflation", "cpi", "ppi", "core pce", "pce", "disinflation"]

[[tier2.macro]]
label = "recession_probabilities"
keywords = ["recession", "slowdown", "hard landing", "soft landing"]

[[tier2.macro]]
label = "growth_outlook"
keywords = ["gdp", "growth", "economic expansion"]

[[tier2.macro]]
label = "labor_market"
keywords = ["labor", "employment", "unemployment", "payroll"]

[[tier2.credit]]
