# Pipeline and LLM settings. Values here are defaults; the env vars named
# below override them (see .env.example).

[llm]
api_base = "http://localhost:11434"   # env: LLM_API_BASE (https://ollama.com for the Ollama API)
model = "llama3"                      # env: LLM_MODEL_NAME
seed = 42                             # env: LLM_SEED
timeout_sec = 300                     # env: LLM_TIMEOUT_SEC; total limit per call (long Writer calls can take minutes)
retries = 3                           # retries on timeouts, 429 and 5xx responses
backoff_sec = 2.0                     # first retry wait; doubles each retry
rate_limit_wait_sec = 20.0            # first wait after HTTP 429 (rate limit); doubles each retry
num_ctx = 16384                       # context window (tokens); local Ollama otherwise defaults to a small one

[temperatures]
planner = 0.1
analyst = 0.15
reasoner = 0.15
writer = 0.15

[limits]
max_prompt_chars = 20000   # agent prompts are trimmed to this length
max_note_chars = 2000      # each web-news note passed to the Analyst

# Validator feedback loop: after the Writer's draft is validated, the
# findings go back to the Writer for a revision. The revision is kept only
# if the validator counts strictly fewer open issues (and it is not much
# shorter than the draft); otherwise the draft stays. Both are stored.
[repair]
enabled = true
max_rounds = 1
min_length_ratio = 0.5
