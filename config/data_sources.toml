units = "Dollars per Barrel"
frequency = "daily"
topics = ["macro", "equity"]
keywords = ["oil", "crude", "wti", "energy prices"]

# ---------------------------------------------------------------------------
# Finnhub (only when a ticker is given)
# ---------------------------------------------------------------------------
[finnhub]
news_days_back = 30
news_max_items = 6
recommendation_periods = 4

# /quote fields -> label (units are the stock's trading currency)
[finnhub.quote_fields]
c = "Current price"
d = "Change"
dp = "Percent change (%)"
o = "Open"
h = "Day high"
l = "Day low"
pc = "Previous close"

# /stock/profile2 fields -> [label, scale]; values are multiplied by scale
# so tables hold plain units
[finnhub.profile_fields]
name = ["Company", 1]
exchange = ["Exchange", 1]
finnhubIndustry = ["Industry", 1]
country = ["Country", 1]
currency = ["Currency", 1]
ipo = ["IPO date", 1]
marketCapitalization = ["Market capitalization (USD)", 1e6]   # API reports USD millions
shareOutstanding = ["Shares outstanding", 1e6]               # API reports millions

# /stock/metric?metric=all keys -> [label, scale]
[finnhub.metric_fields]
peTTM = ["P/E (TTM)", 1]
pbQuarterly = ["P/B (quarterly)", 1]
psTTM = ["P/S (TTM)", 1]
epsTTM = ["EPS (TTM)", 1]
epsGrowthTTMYoy = ["EPS growth TTM YoY (%)", 1]
revenueGrowthTTMYoy = ["Revenue growth TTM YoY (%)", 1]
roeTTM = ["ROE TTM (%)", 1]
netProfitMarginTTM = ["Net profit margin TTM (%)", 1]
dividendYieldIndicatedAnnual = ["Dividend yield, indicated annual (%)", 1]
beta = ["Beta", 1]
"52WeekHigh" = ["52-week high", 1]
"52WeekLow" = ["52-week low", 1]
"52WeekPriceReturnDaily" = ["52-week price return (%)", 1]

# ---------------------------------------------------------------------------
# Tavily web search
# ---------------------------------------------------------------------------
[tavily]
max_results = 6
search_depth = "basic"
snippet_chars = 320
