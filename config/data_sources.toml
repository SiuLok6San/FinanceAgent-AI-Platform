# External data sources used by the Researcher (tools.py, data_providers.py).
# API keys come from .env (FRED_API_KEY, FINNHUB_API_KEY, TAVILY_API_KEY).

http_timeout_sec = 25   # env: HTTP_TIMEOUT

# ---------------------------------------------------------------------------
# FRED: series are picked by keywords in the question (same whole-word
# matching as routing). At most max_series are fetched, in the order below.
# ---------------------------------------------------------------------------
[fred]
max_series = 5

# Observations fetched per series: enough history for 1-year changes.
[fred.observations]
daily = 270
weekly = 60
monthly = 30
quarterly = 24

[[fred.series]]
id = "FEDFUNDS"
title = "Effective Federal Funds Rate"
units = "Percent"
frequency = "monthly"
topics = ["rates"]
keywords = ["fed funds", "federal funds", "policy rate", "fed rate", "rate cut", "rate hike", "fomc", "monetary policy", "higher for longer", "fed"]

[[fred.series]]
id = "T10Y2Y"
title = "10-Year Treasury Minus 2-Year Treasury"
units = "Percent"
frequency = "daily"
topics = ["rates", "macro"]
keywords = ["yield curve", "curve", "inversion", "inverted", "10s2s", "2s10s"]

[[fred.series]]
id = "DGS10"
title = "10-Year Treasury Constant Maturity Yield"
units = "Percent"
frequency = "daily"
topics = ["rates"]
keywords = ["10 year", "treasury", "treasuries", "yield curve", "bond yield", "duration", "higher for longer", "stocks and bonds", "60/40"]

[[fred.series]]
id = "DGS2"
title = "2-Year Treasury Constant Maturity Yield"
units = "Percent"
frequency = "daily"
topics = ["rates"]
keywords = ["2 year", "yield curve", "short end"]

[[fred.series]]
id = "MORTGAGE30US"
title = "30-Year Fixed Rate Mortgage Average"
units = "Percent"
frequency = "weekly"
topics = ["rates", "macro"]
keywords = ["mortgage", "housing"]

[[fred.series]]
id = "BAMLH0A0HYM2"
title = "ICE BofA US High Yield Option-Adjusted Spread"
units = "Percent"
frequency = "daily"
topics = ["credit"]
keywords = ["high yield", "hy", "junk bond", "credit spread", "spread", "default", "default cycle", "credit"]

[[fred.series]]
id = "BAMLC0A0CM"
title = "ICE BofA US Corporate (Investment Grade) Option-Adjusted Spread"
units = "Percent"
frequency = "daily"
topics = ["credit"]
keywords = ["investment grade", "ig", "corporate bond", "credit spread", "spread", "credit"]

[[fred.series]]
id = "CPIAUCSL"
title = "CPI for All Urban Consumers (All Items)"
units = "Index 1982-1984=100"
frequency = "monthly"
topics = ["macro"]
keywords = ["inflation", "cpi", "disinflation"]

[[fred.series]]
id = "PCEPI"
title = "PCE Price Index"
units = "Index 2017=100"
frequency = "monthly"
topics = ["macro"]
keywords = ["pce", "core pce"]

[[fred.series]]
id = "UNRATE"
title = "Unemployment Rate"
units = "Percent"
frequency = "monthly"
topics = ["macro"]
keywords = ["unemployment", "jobless", "labor market", "labor", "employment", "payroll", "jobs"]

[[fred.series]]
id = "SAHMREALTIME"
title = "Real-time Sahm Rule Recession Indicator"
units = "Percentage Points"
frequency = "monthly"
topics = ["macro"]
keywords = ["recession", "hard landing", "soft landing"]

[[fred.series]]
id = "GDPC1"
title = "Real Gross Domestic Product"
units = "Billions of Chained 2017 Dollars"
frequency = "quarterly"
topics = ["macro"]
keywords = ["gdp", "growth", "economy", "recession", "soft landing", "hard landing"]

[[fred.series]]
id = "SP500"
title = "S&P 500 Index"
units = "Index"
frequency = "daily"
topics = ["equity", "portfolio"]
keywords = ["s&p 500", "stock market", "equity market", "equity portfolio", "drawdown", "stocks and bonds", "60/40"]

[[fred.series]]
id = "VIXCLS"
title = "CBOE Volatility Index (VIX)"
units = "Index"
frequency = "daily"
topics = ["equity", "portfolio"]
