# External data sources used by the Researcher (tools.py, data_providers.py).
# API keys come from .env (FRED_API_KEY, FINNHUB_API_KEY, TAVILY_API_KEY).

http_timeout_sec = 25   # env: HTTP_TIMEOUT

# ---------------------------------------------------------------------------
# FRED: the Planner picks series from this catalog; if it cannot, they are
# picked by keywords in the question (same whole-word matching as routing).
# At most max_series are fetched.
#
# Per series: alias (prefix of its fact IDs, e.g. HY_OAS.latest),
# change_unit ("bp" | "pp" for rates and spreads, "pct" for % changes of a
# level, "pts" for index points plus % changes) and level_format
# ("percent" | "index" | "usd" | "bn_usd"). Spreads between two series are
# only computed within the same spread_group ("yield" or "credit_spread"):
# a Treasury yield minus a credit spread means nothing.
# ---------------------------------------------------------------------------
[fred]
max_series = 6

# Observations fetched per series: long enough to say where today's value
# sits in its own history (min / max / average / percentile).
[fred.observations]
daily = 1300      # ~5 years of trading days
weekly = 262      # ~5 years
monthly = 121     # ~10 years
quarterly = 41    # ~10 years

[fred.history_label]
daily = "5y"
weekly = "5y"
monthly = "10y"
quarterly = "10y"

[[fred.series]]
id = "FEDFUNDS"
alias = "FEDFUNDS"
spread_group = "yield"
change_unit = "bp"
level_format = "percent"
title = "Effective Federal Funds Rate"
units = "Percent"
frequency = "monthly"
topics = ["rates"]
keywords = ["fed funds", "federal funds", "policy rate", "fed rate", "rate cut", "rate hike", "fomc", "monetary policy", "higher for longer", "fed"]

