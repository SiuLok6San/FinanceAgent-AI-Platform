# ---------------------------------------------------------------------------
# Finnhub (only when a ticker is given)
# ---------------------------------------------------------------------------
[finnhub]
news_days_back = 30
news_max_items = 6
recommendation_periods = 4

# Field specs: label (shown in tables), id (fact ID suffix, e.g. JPM.pe_ttm),
# unit ("usd" | "pct" | "x" | "ratio" | "count" | "text" | "date") and an
# optional scale that converts the API value to plain units.

# /quote
[finnhub.quote_fields]
c = { label = "Current price", id = "price", unit = "usd" }
d = { label = "Change", id = "change", unit = "usd" }
dp = { label = "Percent change (%)", id = "change_pct", unit = "pct" }
o = { label = "Open", id = "open", unit = "usd" }
h = { label = "Day high", id = "day_high", unit = "usd" }
l = { label = "Day low", id = "day_low", unit = "usd" }
pc = { label = "Previous close", id = "prev_close", unit = "usd" }

# /stock/profile2
[finnhub.profile_fields]
name = { label = "Company", id = "name", unit = "text" }
exchange = { label = "Exchange", id = "exchange", unit = "text" }
finnhubIndustry = { label = "Industry", id = "industry", unit = "text" }
country = { label = "Country", id = "country", unit = "text" }
currency = { label = "Currency", id = "currency", unit = "text" }
ipo = { label = "IPO date", id = "ipo_date", unit = "date" }
marketCapitalization = { label = "Market capitalization (USD)", id = "market_cap", unit = "usd", scale = 1e6 }  # API: USD millions
shareOutstanding = { label = "Shares outstanding", id = "shares_out", unit = "count", scale = 1e6 }          # API: millions

# /stock/metric?metric=all
[finnhub.metric_fields]
peTTM = { label = "P/E (TTM)", id = "pe_ttm", unit = "x" }
pbQuarterly = { label = "P/B (quarterly)", id = "pb", unit = "x" }
psTTM = { label = "P/S (TTM)", id = "ps_ttm", unit = "x" }
epsTTM = { label = "EPS (TTM)", id = "eps_ttm", unit = "usd" }
epsGrowthTTMYoy = { label = "EPS growth TTM YoY (%)", id = "eps_growth_yoy", unit = "pct" }
revenueGrowthTTMYoy = { label = "Revenue growth TTM YoY (%)", id = "revenue_growth_yoy", unit = "pct" }
roeTTM = { label = "ROE TTM (%)", id = "roe", unit = "pct" }
netProfitMarginTTM = { label = "Net profit margin TTM (%)", id = "net_margin", unit = "pct" }
dividendYieldIndicatedAnnual = { label = "Dividend yield, indicated annual (%)", id = "div_yield", unit = "pct" }
beta = { label = "Beta", id = "beta", unit = "ratio" }
"52WeekHigh" = { label = "52-week high", id = "high_52w", unit = "usd" }
"52WeekLow" = { label = "52-week low", id = "low_52w", unit = "usd" }
"52WeekPriceReturnDaily" = { label = "52-week price return (%)", id = "return_52w", unit = "pct" }

# /stock/recommendation (latest period): column -> fact id
[finnhub.recommendation_ids]
strongBuy = "rec_strong_buy"
buy = "rec_buy"
hold = "rec_hold"
sell = "rec_sell"
strongSell = "rec_strong_sell"

# ---------------------------------------------------------------------------
# Tavily web search
# ---------------------------------------------------------------------------
[tavily]
max_results = 6
search_depth = "basic"
snippet_chars = 320
